services:
  - type: web
    name: fraudshield-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python train_models.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"
